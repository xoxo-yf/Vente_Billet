<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Billetterie</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        label { display: block; margin: 10px 0 5px; color: #666; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; margin-top: 20px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        p { text-align: center; margin-top: 15px; font-size: 14px; }
        a { color: #007bff; text-decoration: none; }
        .error { color: red; font-size: 14px; margin-top: 10px; display: none; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Connexion</h2>
        <form id="form-login">
            <label>Adresse Email</label>
            <input type="email" id="login-email" required>
            
            <label>Mot de passe</label>
            <input type="password" id="login-password" required>
            
            <button type="submit">Se connecter</button>
        </form>
        <div id="error-message" class="error"></div>
        <p>Pas encore de compte ? <a href="register.html">S'inscrire ici</a></p>
    </div>
    <script src="app.js"></script>
</body>
</html>
