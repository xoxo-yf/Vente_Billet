<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Billetterie</title>
    <style>
       :root { color-scheme: dark; }

body { font-family: Arial, sans-serif; background-color: #0b1118; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #e5e9f0; }
.container { background: #141c26; padding: 30px; border-radius: 8px; border: 1px solid #2a3646; box-shadow: 0 4px 16px rgba(0,0,0,0.5); width: 100%; max-width: 400px; }
h2 { text-align: center; color: #e5e9f0; margin-bottom: 20px; }
label { display: block; margin: 10px 0 5px; color: #94a3b8; }
input { width: 100%; padding: 10px; border: 1px solid #2a3646; border-radius: 4px; box-sizing: border-box; background: #0b1118; color: #e5e9f0; }
input:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }
button { width: 100%; padding: 12px; background-color: #0f4c5c; color: white; border: none; border-radius: 4px; font-size: 16px; margin-top: 20px; cursor: pointer; }
button:hover { background-color: #17697e; }
p { text-align: center; margin-top: 15px; font-size: 14px; color: #94a3b8; }
a { color: #38bdf8; text-decoration: none; }
a:hover { text-decoration: underline; }
.error { color: #fca5a5; font-size: 14px; margin-top: 10px; display: none; text-align: center; } </style>
</head>
<body>
    <div class="container">
        <h2>Connexion</h2>
        <form id="form-login">
            <label>Adresse Email</label>
            <input type="email" id="login-email" required>
            
            <label>Mot de passe</label>
            <input type="password" id="login-password" required>
            
            <button type="submit">Se connecter</button>
        </form>
        <div id="error-message" class="error"></div>
        <p>Pas encore de compte ? <a href="register.html">S'inscrire ici</a></p>
    </div>
    <script src="app.js"></script>
</body>
</html>
