<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un Événement - Billetterie</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; padding: 40px; display: flex; justify-content: center; margin: 0; }
        .form-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 550px; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; font-weight: 600; }
        label { display: block; margin: 14px 0 6px; color: #34495e; font-weight: bold; font-size: 14px; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 15px; transition: border 0.2s; }
        input:focus, textarea:focus { border-color: #6f42c1; outline: none; }
        textarea { height: 100px; resize: none; }
        .row { display: flex; gap: 15px; }
        .col { flex: 1; }
        button { width: 100%; padding: 14px; background-color: #6f42c1; color: white; border: none; border-radius: 6px; font-size: 16px; margin-top: 30px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background-color: #59339d; }
        .success { background-color: #d1e7dd; color: #0f5132; padding: 12px; border-radius: 6px; text-align: center; margin-top: 20px; display: none; font-weight: bold; }
        .error { background-color: #f8d7da; color: #842029; padding: 12px; border-radius: 6px; text-align: center; margin-top: 20px; display: none; }
        .nav-link { display: block; text-align: center; margin-top: 20px; color: #6f42c1; text-decoration: none; font-size: 14px; }
        .nav-link:hover { text-underline-offset: 3px; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>Publier un nouvel Événement</h2>
        <form id="form-event">
            <label>Titre de l'événement</label>
            <input type="text" id="event-titre" placeholder="ex: Concert de Rohff" required>

            <label>Description</label>
            <textarea id="event-description" placeholder="Détails, artistes, première partie..." required></textarea>

            <label>Date et Heure</label>
            <input type="datetime-local" id="event-date" required>

            <div class="row">
                <div class="col">
                    <label>Ville</label>
                    <input type="text" id="event-ville" placeholder="ex: Paris" required>
                </div>
                <div class="col">
                    <label>Nom du Lieu (Salle)</label>
                    <input type="text" id="event-lieu" placeholder="ex: Accor Arena" required>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <label>Places disponibles</label>
                    <input type="number" id="event-places" min="1" placeholder="ex: 500" required>
                </div>
                <div class="col">
                    <label>Prix du billet (€)</label>
                    <input type="number" id="event-prix" min="0" step="0.01" placeholder="ex: 45.00" required>
                </div>
            </div>

            <button type="submit">Mettre en vente sur la plateforme</button>
        </form>
        <div id="ok-msg" class="success">L'événement a été injecté avec succès dans PostgreSQL !</div>
        <div id="err-msg" class="error"></div>
        <a href="index.html" class="nav-link">Retour à la page de connexion</a>
    </div>

    <script>
        // Écoute le clic de soumission du formulaire
    document.getElementById('form-event').addEventListener('submit', async (e) => {
        e.preventDefault(); // Bloque le rafraîchissement de la page
        
        // 1. Récupération des valeurs tapées à l'écran
        const titre = document.getElementById('event-titre').value;
        const description = document.getElementById('event-description').value;
        const dateSaisie = document.getElementById('event-date').value;
        const date = new Date(dateSaisie).toISOString(); // Convertit la date pour PostgreSQL
        const ville = document.getElementById('event-ville').value;
        const nomLieu = document.getElementById('event-lieu').value;
        const placesTotales = parseInt(document.getElementById('event-places').value);
        const prix = parseFloat(document.getElementById('event-prix').value);

        try {
            // 2. L'action de POSTER vers l'API NestJS
            const reponse = await fetch('http://localhost:3000/api/events', {
                method: 'POST', // Spécifie la méthode HTTP POST
                headers: { 
                    'Content-Type': 'application/json' // Dit à l'API qu'on envoie du JSON
                },
                body: JSON.stringify({ titre, description, date, ville, nomLieu, placesTotales, prix }) // Convertit l'objet en texte JSON
            });

            const result = await reponse.json();

            // 3. Gestion des erreurs renvoyées par le serveur
            if (!reponse.ok) {
                throw new Error(result.message || "Impossible de publier l'événement.");
            }

            // 4. Succès : Affichage du bandeau vert si PostgreSQL a enregistré la ligne
            document.getElementById('ok-msg').style.display = 'block';
            document.getElementById('form-event').reset(); // Vide les champs pour le prochain événement

        } catch (error) {
            // Affichage du bandeau rouge en cas d'erreur de validation
            const errDiv = document.getElementById('err-msg');
            errDiv.innerText = error.message;
            errDiv.style.display = 'block';
        }
    });

    </script>
</body>
</html>
