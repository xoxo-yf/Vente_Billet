<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un Événement - Billetterie</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@600&display=swap');

       :root {
        color-scheme: dark;
        --ink: #e8e4ec;
        --ink-soft: #a9a2b0;
        --ink-faint: #6f6877;
        --paper: #0f0d12;
        --surface: #18151d;
        --line: #2d2834;
        --accent: #b79fd1;
        --accent-dark: #cdb8e3;
        --accent-tint: rgba(183, 159, 209, 0.18);
        --success-tint: rgba(110, 160, 105, 0.18);
        --success-text: #a9d4a4;
        --error-tint: rgba(200, 100, 90, 0.18);
        --error-text: #f0a69d;
        --radius: 16px;
        --font-sans: 'IBM Plex Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        --font-title: 'IBM Plex Serif', Georgia, 'Times New Roman', serif;
}

        * { box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            background-color: var(--paper);
            padding: 48px 24px;
            display: flex;
            justify-content: center;
            margin: 0;
            color: var(--ink);
            line-height: 1.5;
        }

        .form-box {
            background: var(--surface);
            padding: 42px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(120, 100, 90, 0.1);
            border: 1px solid var(--line);
            width: 100%;
            max-width: 560px;
        }

        .form-icon { text-align: center; font-size: 30px; margin-bottom: 6px; }

        h2 {
            text-align: center;
            color: var(--ink);
            margin: 0 0 6px;
            font-family: var(--font-title);
            font-size: 24px;
            font-weight: 600;
        }

        .subtitle {
            text-align: center;
            color: var(--ink-soft);
            font-size: 14px;
            margin: 0 0 28px;
        }

        label { display: block; margin: 16px 0 6px; color: var(--ink); font-weight: 600; font-size: 13.5px; }

        input, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 14.5px;
            font-family: inherit;
            color: var(--ink);
            background: var(--paper);
            transition: border-color .2s ease, box-shadow .2s ease;
        }
        input::placeholder, textarea::placeholder { color: var(--ink-faint); }
        input:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-tint); background: var(--surface); }
        textarea { height: 100px; resize: none; }

        .row { display: flex; gap: 15px; }
        .col { flex: 1; }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 999px;
            font-size: 15.5px;
            margin-top: 30px;
            cursor: pointer;
            font-weight: 700;
            transition: background-color .2s ease, transform .15s ease;
        }
        button:hover { background-color: var(--accent-dark); transform: translateY(-1px); }

        .success {
            background-color: var(--success-tint);
            color: var(--success-text);
            padding: 13px;
            border-radius: 12px;
            text-align: center;
            margin-top: 20px;
            display: none;
            font-weight: 600;
            font-size: 14px;
        }
        .error {
            background-color: var(--error-tint);
            color: var(--error-text);
            padding: 13px;
            border-radius: 12px;
            text-align: center;
            margin-top: 20px;
            display: none;
            font-size: 14px;
            font-weight: 600;
        }

        .nav-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: var(--accent-dark);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        .nav-link:hover { text-underline-offset: 3px; text-decoration: underline; }

        @media (max-width: 480px) {
            .form-box { padding: 32px 24px; }
            .row { flex-direction: column; gap: 0; }


            .form-box { box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
button { color: #1a1420; }
button:hover { background-color: var(--accent-dark); }
input[type="datetime-local"]::-webkit-calendar-picker-indicator { filter: invert(0.8); }
        }
    </style>
</head>
<body>
    <div class="form-box">
        <div class="form-icon"></div>
        <h2>Publier un nouvel événement</h2>
        <p class="subtitle">Quelques informations suffisent pour le mettre en vente</p>
        <form id="form-event">
            <label>Titre de l'événement</label>
            <input type="text" id="event-titre" placeholder="ex: Concert de Rohff" required>

            <label>Description</label>
            <textarea id="event-description" placeholder="Détails, artistes, première partie..." required></textarea>

            <label>Date et heure</label>
            <input type="datetime-local" id="event-date" required>

            <div class="row">
                <div class="col">
                    <label>Ville</label>
                    <input type="text" id="event-ville" placeholder="ex: Paris" required>
                </div>
                <div class="col">
                    <label>Nom du lieu (salle)</label>
                    <input type="text" id="event-lieu" placeholder="ex: Accor Arena" required>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <label>Places disponibles</label>
                    <input type="number" id="event-places" min="1" placeholder="ex: 500" required>
                </div>
                <div class="col">
                    <label>Prix du billet (Ar)</label>
                    <input type="number" id="event-prix" min="0" step="0.01" placeholder="ex: 45.00" required>
                </div>
            </div>

            <button type="submit">Mettre en vente sur la plateforme</button>
        </form>
        <div id="ok-msg" class="success"> L'événement a été publié avec succès !</div>
        <div id="err-msg" class="error"></div>
        <a href="admin.html" class="nav-link">retour</a>
    </div>

    <script>
        // Écoute le clic de soumission du formulaire
    document.getElementById('form-event').addEventListener('submit', async (e) => {
        e.preventDefault(); // Bloque le rafraîchissement de la page

        // 1. Récupération des valeurs tapées à l'écran
        const titre = document.getElementById('event-titre').value;
        const description = document.getElementById('event-description').value;
        const dateSaisie = document.getElementById('event-date').value;
        const date = new Date(dateSaisie).toISOString(); // Convertit la date pour PostgreSQL
        const ville = document.getElementById('event-ville').value;
        const nomLieu = document.getElementById('event-lieu').value;
        const placesTotales = parseInt(document.getElementById('event-places').value);
        const prix = parseFloat(document.getElementById('event-prix').value);

        try {
            //  L'action de POSTER vers l'API NestJS
            const reponse = await fetch('http://localhost:3000/api/events', {
                method: 'POST', // Spécifie la méthode HTTP POST
                headers: {
                    'Content-Type': 'application/json' // Dit à l'API qu'on envoie du JSON
                },
                body: JSON.stringify({ titre, description, date, ville, nomLieu, placesTotales, prix }) // Convertit l'objet en texte JSON
            });

            const result = await reponse.json();

            //  Gestion des erreurs renvoyées par le serveur
            if (!reponse.ok) {
                throw new Error(result.message || "Impossible de publier l'événement.");
            }

            //  Affichage du bandeau vert si PostgreSQL a enregistré la ligne
            document.getElementById('ok-msg').style.display = 'block';
            document.getElementById('err-msg').style.display = 'none';
            document.getElementById('form-event').reset(); // Vide les champs pour le prochain événement

        } catch (error) {
            // Affichage du bandeau rouge en cas d'erreur de validation
            const errDiv = document.getElementById('err-msg');
            errDiv.innerText = error.message;
            errDiv.style.display = 'block';
            document.getElementById('ok-msg').style.display = 'none';
        }
    });



    </script>
</body>
</html>
